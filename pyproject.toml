[project]
name = "staged-binary-local-diffusion-attention"
version = "0.1.2"
description = "Paper experiments for staged binary-local diffusion attention"
requires-python = ">=3.14"
dependencies = [
    "torch==2.14.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
